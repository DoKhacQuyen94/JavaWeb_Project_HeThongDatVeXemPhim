<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Movie System</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h2 {
            font-weight: 800;
            color: #1e3c72;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid #dee2e6;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 0.25rem rgba(42, 82, 152, 0.1);
        }

        .btn-register {
            background: linear-gradient(to right, #e94560, #cf3d55);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
            color: white;
            opacity: 0.9;
        }

        .login-link {
            text-decoration: none;
            color: #1e3c72;
            font-weight: 600;
        }

        .alert {
            border-radius: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

<div class="register-card">
    <div class="register-header">
        <h2>Tạo Tài Khoản</h2>
        <p class="text-muted small">Đăng ký để trải nghiệm những bộ phim hay nhất</p>
    </div>

    <!-- Thông báo từ Server -->
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${error}"></span>
    </div>
    <div th:if="${message}" class="alert alert-success d-flex align-items-center mb-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/register}" method="post" th:object="${register}" id="registerForm">
        <!-- Ô nhập Email -->
        <div class="mb-3">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" th:field="*{email}"
                       placeholder="name@example.com" required>
            </div>
        </div>

        <!-- Ô nhập Mật khẩu -->
        <div class="mb-3">
            <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" th:field="*{password}"
                       id="password" placeholder="Tối thiểu 6 ký tự" required>
            </div>
        </div>

        <!-- Ô xác nhận Mật khẩu (Mới thêm) -->
        <div class="mb-4">
            <label class="form-label">Xác nhận mật khẩu <span class="text-danger">*</span></label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="Nhập lại mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-register w-100">Đăng Ký Ngay</button>

        <div class="text-center mt-4">
            <p class="text-muted small">
                Đã có tài khoản?
                <a th:href="@{/login}" class="login-link">Đăng nhập ngay</a>
            </p>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Logic kiểm tra mật khẩu khớp nhau trước khi gửi form
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            e.preventDefault(); // Ngăn gửi form
            alert("Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.");
        }
    });
</script>

</body>
</html>
