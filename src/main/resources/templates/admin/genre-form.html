<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title th:text="${genre.genreId != null ? 'Cập Nhật Thể Loại' : 'Thêm Thể Loại'}">Movie System</title>
  <style>
    .form-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .form-header {
      background: linear-gradient(45deg, #1a1a2e, #16213e);
      color: white;
      border-radius: 20px 20px 0 0 !important;
      padding: 25px;
    }
    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 15px;
      border: 1px solid #dee2e6;
      transition: all 0.3s;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(233, 69, 96, 0.1);
      border-color: #e94560;
    }
    .btn-save {
      background-color: #e94560;
      border: none;
      color: white;
      padding: 10px 30px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-save:hover {
      background-color: #cf3d55;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
    }
    .btn-cancel {
      border-radius: 10px;
      padding: 10px 30px;
    }
  </style>
</head>
<body>

<div layout:fragment="content">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="card form-card">
          <!-- Header -->
          <div class="card-header form-header border-0">
            <div class="d-flex align-items-center">
              <div class="bg-danger rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                <i class="bi bi-tag-fill fs-5"></i>
              </div>
              <h4 class="mb-0 fw-bold" th:text="${genre.genreId != null ? 'Cập Nhật Thể Loại' : 'Thêm Thể Loại Mới'}">Form</h4>
            </div>
          </div>

          <!-- Body -->
          <div class="card-body p-4 p-md-5">
            <form th:action="@{/admin/genres/save}" th:object="${genre}" method="post">

              <!-- Trường Ẩn ID -->
              <input type="hidden" th:field="*{genreId}" />

              <!-- Nhập tên thể loại -->
              <div class="mb-4">
                <label for="name" class="form-label">Tên thể loại phim <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-fonts"></i></span>
                  <input type="text"
                         class="form-control border-start-0"
                         id="name"
                         th:field="*{name}"
                         placeholder="Ví dụ: Hành động, Viễn tưởng..."
                         required>
                </div>
                <div class="form-text mt-2 small">Sử dụng tên ngắn gọn và súc tích để khách hàng dễ dàng tìm kiếm.</div>
              </div>

              <hr class="my-4 opacity-50">

              <!-- Nút bấm -->
              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/admin/genres}" class="btn btn-light btn-cancel border text-secondary fw-500">
                  <i class="bi bi-x-lg me-1"></i> Hủy Bỏ
                </a>
                <button type="submit" class="btn btn-save">
                  <i class="bi bi-check2-circle me-1"></i> Lưu Thông Tin
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4 text-muted small">
          <i class="bi bi-info-circle me-1"></i> Hệ thống sẽ tự động cập nhật thể loại vào danh sách phim ngay lập tức.
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle (Nên dùng bản mới nhất thay cho bản cũ 4.3.1 của bạn) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
