<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh Sách Phim</title>
    <style>
        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .movie-poster-thumb {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-action {
            border-radius: 8px;
            padding: 6px 12px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
        }
        .page-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a1a2e;
            border-left: 5px solid #e94560;
            padding-left: 15px;
        }
        .duration-badge {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="container py-4">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title mb-0">Danh Sách Phim</h2>
            <a th:href="@{/admin/movies/add}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Thêm Phim Mới
            </a>
        </div>

        <!-- Thông báo -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4" style="width: 8%;">ID</th>
                        <th style="width: 8%;">Poster</th>
                        <th style="width: 34%;">Tên Phim</th>
                        <th style="width: 15%;">Thời Lượng</th>
                        <th style="width: 15%;">Ngày Khởi Chiếu</th>
                        <th class="text-center pe-4" style="width: 20%;">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Trạng thái trống -->
                    <tr th:if="${#lists.isEmpty(movies)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-film fs-1 d-block mb-2"></i>
                            Chưa có bộ phim nào trong danh sách.
                        </td>
                    </tr>

                    <!-- Danh sách phim -->
                    <tr th:each="movie : ${movies}">
                        <td class="ps-4">
                            <span class="text-muted fw-bold" th:text="'#' + ${movie.movieId}"></span>
                        </td>
                        <td>
                            <img th:if="${movie.posterUrl != null and movie.posterUrl != ''}"
                                 th:src="${movie.posterUrl}"
                                 class="movie-poster-thumb" alt="Poster">
                            <div th:unless="${movie.posterUrl != null and movie.posterUrl != ''}"
                                 class="movie-poster-thumb bg-light d-flex align-items-center justify-content-center">
                                <i class="bi bi-image text-muted"></i>
                            </div>
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${movie.title}">Tên Phim</div>
                        </td>
                        <td>
                            <span class="badge duration-badge text-dark">
                                <i class="bi bi-clock me-1"></i> <span th:text="${movie.duration + ' phút'}"></span>
                            </span>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${#temporals.format(movie.releaseDate, 'dd/MM/yyyy')}"></span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="btn-group">
                                <a th:href="@{/admin/movies/edit/{id}(id=${movie.movieId})}"
                                   class="btn btn-outline-warning btn-action me-2" title="Sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/movies/delete/{id}(id=${movie.movieId})}"
                                   class="btn btn-outline-danger btn-action"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa phim này? Mọi lịch chiếu liên quan cũng sẽ bị ảnh hưởng.');"
                                   title="Xóa">
                                    <i class="bi bi-trash3"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3 text-end text-muted small">
            Tổng cộng: <span class="fw-bold text-dark" th:text="${movies != null ? movies.size() : 0}"></span> phim
        </div>
    </div>
</div>

</body>
</html>
