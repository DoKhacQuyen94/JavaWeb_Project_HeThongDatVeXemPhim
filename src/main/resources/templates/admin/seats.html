<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Quản Lý Ghế Ngồi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark">Danh Sách Ghế Ngồi</h2>
            <p class="text-muted mb-0">Quản lý sơ đồ ghế cho các phòng chiếu</p>
        </div>
        <a th:href="@{/admin/seats/add}" class="btn btn-success shadow-sm">
            <i class="bi bi-plus-lg"></i> Thêm Ghế Mới
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <span th:text="${message}">Thông báo thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <span th:text="${error}">Thông báo lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="py-3">ID</th>
                        <th class="py-3">Tên Ghế (Mã)</th>
                        <th class="py-3 text-start">Phòng Chiếu</th>
                        <th class="py-3">Hành Động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="seat : ${seats}">
                        <td>
                            <span class="badge bg-secondary" th:text="'#' + ${seat.seatId}">1</span>
                        </td>
                        <td class="fw-bold" th:text="${seat.seatName}">A1</td>
                        <td class="text-start">
                            <span th:if="${seat.room != null}">
                                <i class="bi bi-door-closed me-1"></i>
                                <span th:text="${seat.room.roomName}">Phòng 1</span>
                            </span>
                            <span th:unless="${seat.room != null}" class="text-danger small italic">Chưa xếp phòng</span>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/admin/seats/edit/{id}(id=${seat.seatId})}"
                                   class="btn btn-warning btn-sm me-2 rounded shadow-sm">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/admin/seats/delete/{id}(id=${seat.seatId})}"
                                   class="btn btn-danger btn-sm rounded shadow-sm"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa ghế này?');">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(seats)}">
                        <td colspan="4" class="py-5 text-muted">Chưa có dữ liệu ghế ngồi nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
