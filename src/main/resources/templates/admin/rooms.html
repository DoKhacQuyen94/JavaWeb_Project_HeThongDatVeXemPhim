<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title>Quản Lý Phòng Chiếu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .table-hover tbody tr:hover {
      background-color: #f8f9fa;
      transition: 0.3s;
    }
    .btn-action {
      width: 80px;
    }
  </style>
</head>
<body>

<div layout:fragment="content" class="container mt-4">

  <div class="row mb-4 align-items-center">
    <div class="col-md-6">
      <h2 class="fw-bold text-dark"><i class="bi bi-door-open-fill me-2"></i>Danh Sách Phòng Chiếu</h2>
      <p class="text-muted mb-0">Quản lý các phòng và không gian xem phim</p>
    </div>
    <div class="col-md-6 text-end">
      <a th:href="@{/admin/rooms/add}" class="btn btn-primary shadow-sm">
        <i class="bi bi-plus-circle me-1"></i> Thêm Phòng Mới
      </a>
    </div>
  </div>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
    <strong th:text="${message}"></strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
    <strong th:text="${error}"></strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div th:if="${#lists.isEmpty(rooms)}" class="text-center py-5">
    <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" alt="empty" style="width: 100px; opacity: 0.5;">
    <p class="mt-3 text-muted">Chưa có phòng chiếu nào được tạo.</p>
  </div>

  <div class="card border-0 shadow-sm" th:if="${not #lists.isEmpty(rooms)}">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center mb-0">
          <thead class="table-light">
          <tr>
            <th class="py-3" style="width: 15%">ID</th>
            <th class="py-3 text-start">Tên Phòng Chiếu</th>
            <th class="py-3" style="width: 25%">Hành Động</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="room : ${rooms}">
            <td>
              <span class="badge bg-secondary" th:text="'#' + ${room.roomId}">1</span>
            </td>
            <td class="text-start fw-bold text-dark" th:text="${room.roomName}">Phòng 1</td>
            <td>
              <div class="btn-group" role="group">
                <a th:href="@{/admin/rooms/edit/{id}(id=${room.roomId})}"
                   class="btn btn-outline-warning btn-sm btn-action me-2">
                  <i class="bi bi-pencil-square"></i> Sửa
                </a>
                <a th:href="@{/admin/rooms/delete/{id}(id=${room.roomId})}"
                   class="btn btn-outline-danger btn-sm btn-action"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa phòng này? Các ghế liên quan có thể bị ảnh hưởng.');">
                  <i class="bi bi-trash"></i> Xóa
                </a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</body>
</html>
