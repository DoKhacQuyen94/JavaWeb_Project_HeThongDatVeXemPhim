<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Thanh Toán Thành Công</title>
</head>
<body>

<div layout:fragment="content">
    <!-- Có thể giữ lại Navbar đơn giản ở đây nếu muốn -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/home}">🎬 CinemaTicket</a>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-lg p-5 border-0 rounded-4">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#28a745" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>

                    <h2 class="text-success fw-bold mb-3" th:text="${message}">Thanh toán thành công!</h2>
                    <p class="text-muted mb-4">Cảm ơn bạn đã sử dụng dịch vụ của chúng tôi. Đơn hàng của bạn đã được ghi nhận.</p>

                    <div class="d-grid gap-3 d-md-block">
                        <a th:href="@{/home}" class="btn btn-outline-primary px-4 me-2 fw-bold">Về Trang Chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
