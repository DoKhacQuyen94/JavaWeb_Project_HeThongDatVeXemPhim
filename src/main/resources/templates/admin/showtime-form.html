<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title th:text="${showtime.showtimeId != null ? 'Cập Nhật Lịch Chiếu' : 'Thêm Lịch Chiếu'}">Movie System</title>
  <style>
    .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .form-header { background: linear-gradient(45deg, #1a1a2e, #16213e); color: white; border-radius: 20px 20px 0 0 !important; padding: 25px; }
    .form-label { font-weight: 600; color: #495057; margin-bottom: 8px; }
    .form-control, .form-select { border-radius: 10px; padding: 12px 15px; border: 1px solid #dee2e6; }
    .form-control:focus, .form-select:focus { border-color: #e94560; box-shadow: 0 0 0 0.25rem rgba(233, 69, 96, 0.1); }
    .btn-save { background-color: #e94560; border: none; color: white; padding: 10px 35px; border-radius: 10px; font-weight: 600; transition: 0.3s; }
    .btn-save:hover { background-color: #cf3d55; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3); }
    .input-group-text { border-radius: 10px 0 0 10px; background-color: #f8f9fa; border-right: none; }
    .border-start-0 { border-radius: 0 10px 10px 0 !important; }
  </style>
</head>
<body>

<div layout:fragment="content">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">

        <div class="card form-card">
          <!-- Header -->
          <div class="card-header form-header border-0">
            <div class="d-flex align-items-center">
              <div class="bg-danger rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                <i class="bi bi-calendar-check fs-5"></i>
              </div>
              <div>
                <h4 class="mb-0 fw-bold" th:text="${showtime.showtimeId != null ? 'Cập Nhật Lịch Chiếu' : 'Thiết Lập Lịch Chiếu Mới'}">Form Lịch Chiếu</h4>
                <small class="opacity-75">Sắp xếp khung giờ chiếu cho các bộ phim tại rạp</small>
              </div>
            </div>
          </div>

          <!-- Body -->
          <div class="card-body p-4 p-md-5">
            <!-- Thông báo lỗi từ hệ thống (trùng lịch,...) -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
              <i class="bi bi-exclamation-octagon-fill me-2"></i> <span th:text="${error}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/admin/showtimes/save}" th:object="${showtime}" method="post">
              <input type="hidden" th:field="*{showtimeId}" />

              <div class="row">
                <!-- Chọn Phim -->
                <div class="col-md-12 mb-4">
                  <label class="form-label">Bộ phim trình chiếu <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-film"></i></span>
                    <select class="form-select border-start-0" th:field="*{movie}" required>
                      <option value="" selected disabled>-- Chọn bộ phim --</option>
                      <option th:each="m : ${movies}" th:value="${m.movieId}" th:text="${m.title}"></option>
                    </select>
                  </div>
                </div>

                <!-- Chọn Phòng -->
                <div class="col-md-6 mb-4">
                  <label class="form-label">Phòng chiếu <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-door-open"></i></span>
                    <select class="form-select border-start-0" th:field="*{room}" required>
                      <option value="" selected disabled>-- Chọn phòng --</option>
                      <option th:each="r : ${rooms}" th:value="${r.roomId}" th:text="${r.roomName}"></option>
                    </select>
                  </div>
                </div>

                <!-- Nhập Giá -->
                <div class="col-md-6 mb-4">
                  <label class="form-label">Giá vé niêm yết <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                    <input type="number" class="form-control border-start-0" th:field="*{price}" placeholder="Ví dụ: 85000" required min="0">
                    <span class="input-group-text bg-white">VNĐ</span>
                  </div>
                </div>

                <!-- Giờ Bắt Đầu -->
                <div class="col-md-6 mb-4">
                  <label class="form-label text-success"><i class="bi bi-play-circle me-1"></i> Giờ bắt đầu <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control" th:field="*{startTime}" required>
                </div>

                <!-- Giờ Kết Thúc -->
                <div class="col-md-6 mb-4">
                  <label class="form-label text-danger"><i class="bi bi-stop-circle me-1"></i> Giờ kết thúc (Dự kiến) <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control" th:field="*{endTime}" required>
                </div>
              </div>

              <hr class="my-4 opacity-50">

              <!-- Thao tác -->
              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/admin/showtimes}" class="btn btn-light border px-4 rounded-pill text-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-save rounded-pill">
                  <i class="bi bi-cloud-upload me-2"></i>Lưu Lịch Chiếu
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Gợi ý Admin -->
        <div class="mt-4 p-3 bg-light rounded-4 border shadow-sm">
          <p class="mb-0 small text-muted">
            <i class="bi bi-lightbulb-fill text-warning me-2"></i>
            <strong>Mẹo:</strong> Hãy kiểm tra kỹ thời lượng phim để thiết lập <strong>Giờ kết thúc</strong> hợp lý (thường sau Giờ bắt đầu khoảng 90-150 phút tùy phim). Tránh đặt các suất chiếu quá sát nhau trong cùng một phòng để có thời gian dọn dẹp rạp.
          </p>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
