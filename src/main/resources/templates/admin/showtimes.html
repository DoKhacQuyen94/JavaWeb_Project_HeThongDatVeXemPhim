<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Lịch Chiếu</title>
    <style>
        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }
        .page-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a1a2e;
            border-left: 5px solid #e94560;
            padding-left: 15px;
        }
        .price-badge {
            background-color: #fff5f6;
            color: #e94560;
            font-weight: 700;
            border: 1px solid #ffccd5;
        }
        .time-info {
            font-size: 0.9rem;
            line-height: 1.2;
        }
        .btn-action {
            border-radius: 8px;
            padding: 6px 12px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="container py-4">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title mb-0">Lịch Chiếu Phim</h2>
            <a th:href="@{/admin/showtimes/add}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="bi bi-plus-lg me-2"></i>Thêm Lịch Chiếu
            </a>
        </div>

        <!-- Thông báo -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small fw-bold">
                    <tr>
                        <th class="ps-4" style="width: 8%;">ID</th>
                        <th style="width: 25%;">Phim</th>
                        <th style="width: 15%;">Phòng</th>
                        <th style="width: 15%;">Giá Vé</th>
                        <th style="width: 17%;">Thời Gian</th>
                        <th class="text-center pe-4" style="width: 20%;">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Trạng thái trống -->
                    <tr th:if="${#lists.isEmpty(showtimes)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>
                            Hiện tại chưa có lịch chiếu nào được thiết lập.
                        </td>
                    </tr>

                    <!-- Danh sách lịch chiếu -->
                    <tr th:each="show : ${showtimes}">
                        <td class="ps-4">
                            <span class="text-muted fw-bold" th:text="'#' + ${show.showtimeId}"></span>
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${show.movie != null ? show.movie.title : 'N/A'}"></div>
                            <small class="text-muted" th:if="${show.movie != null}" th:text="${show.movie.duration + ' phút'}"></small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">
                                <i class="bi bi-door-open me-1"></i> <span th:text="${show.room != null ? show.room.roomName : 'N/A'}"></span>
                            </span>
                        </td>
                        <td>
                            <span class="badge price-badge p-2">
                                <span th:text="${#numbers.formatDecimal(show.price, 0, 'COMMA', 0, 'POINT')}"></span> đ
                            </span>
                        </td>
                        <td>
                            <div class="time-info">
                                <div class="text-success fw-bold">
                                    <i class="bi bi-play-circle me-1"></i> <span th:text="${#temporals.format(show.startTime, 'HH:mm - dd/MM')}"></span>
                                </div>
                                <div class="text-muted small">
                                    <i class="bi bi-stop-circle me-1"></i> <span th:text="${#temporals.format(show.endTime, 'HH:mm - dd/MM')}"></span>
                                </div>
                            </div>
                        </td>
                        <td class="text-center pe-4">
                            <div class="btn-group">
                                <a th:href="@{/admin/showtimes/edit/{id}(id=${show.showtimeId})}"
                                   class="btn btn-outline-warning btn-action me-2" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/showtimes/delete/{id}(id=${show.showtimeId})}"
                                   class="btn btn-outline-danger btn-action"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa lịch chiếu này? Khách hàng sẽ không thể đặt vé cho suất này nữa.');"
                                   title="Xóa">
                                    <i class="bi bi-trash3"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3 d-flex justify-content-between align-items-center text-muted small">
            <span>Hiển thị <b th:text="${showtimes != null ? showtimes.size() : 0}"></b> suất chiếu</span>
            <span><i class="bi bi-info-circle me-1"></i> Lưu ý: Kiểm tra kỹ thời gian để tránh trùng lịch phòng chiếu.</span>
        </div>
    </div>
</div>

</body>
</html>
