<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Movie System</title>

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            /* Hiệu ứng Gradient hiện đại phối hợp với tone màu rạp phim */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h2 {
            font-weight: 800;
            color: #1e3c72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 0.25rem rgba(42, 82, 152, 0.1);
        }

        .btn-login {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4);
            opacity: 0.9;
        }

        .register-link {
            text-decoration: none;
            color: #1e3c72;
            font-weight: 600;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-header">
        <h2>Đăng Nhập</h2>
        <p>Chào mừng bạn trở lại với rạp phim!</p>
    </div>

    <!-- Thông báo lỗi đăng nhập -->
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center mb-4">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>Email hoặc mật khẩu không chính xác!</div>
    </div>

    <!-- Thông báo đăng xuất -->
    <div th:if="${logout}" class="alert alert-success d-flex align-items-center mb-4">
        <i class="bi bi-check-circle-fill me-2"></i>
        <div>Bạn đã đăng xuất thành công.</div>
    </div>

    <!-- FORM LOGIN -->
    <form th:action="@{/login}" method="post" th:object="${login}">

        <div class="mb-4">
            <label class="form-label">Email tài khoản</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="text"
                       class="form-control"
                       placeholder="Nhập email của bạn"
                       th:field="*{email}"
                       required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input type="password"
                       class="form-control"
                       placeholder="Nhập mật khẩu"
                       th:field="*{password}"
                       required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100 mb-3">
            Đăng Nhập
        </button>

        <div class="text-center mt-4">
            <p class="text-muted small">
                Chưa có tài khoản?
                <a th:href="@{/register}" class="register-link">Đăng ký ngay</a>
            </p>
        </div>

    </form>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
