<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Thể loại phim</title>
  <style>
    .table-container {
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }
    .genre-badge {
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 8px;
      background-color: #f8f9fa;
      color: #1a1a2e;
      border: 1px solid #dee2e6;
    }
    .btn-action {
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
    }
    .page-title {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #1a1a2e;
      border-left: 5px solid #e94560;
      padding-left: 15px;
    }
  </style>
</head>
<body>

<div layout:fragment="content">
  <div class="container py-4">

    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="page-title mb-0">Quản lý Thể Loại</h2>
      <a th:href="@{/admin/genres/add}" class="btn btn-primary rounded-pill px-4 shadow-sm">
        <i class="bi bi-plus-lg me-2"></i>Thêm Thể Loại
      </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Table Card -->
    <div class="card border-0 shadow-sm table-container">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th class="ps-4" style="width: 10%;">ID</th>
            <th style="width: 60%;">Tên Thể Loại</th>
            <th class="text-center pe-4" style="width: 30%;">Thao Tác</th>
          </tr>
          </thead>
          <tbody>
          <!-- Trạng thái trống -->
          <tr th:if="${#lists.isEmpty(genres)}">
            <td colspan="3" class="text-center py-5 text-muted">
              <i class="bi bi-folder2-open fs-1 d-block mb-2"></i>
              Chưa có thể loại nào được tạo.
            </td>
          </tr>

          <!-- Danh sách thể loại -->
          <tr th:each="genre : ${genres}">
            <td class="ps-4">
              <span class="text-muted fw-bold" th:text="'#' + ${genre.genreId}"></span>
            </td>
            <td>
              <span class="genre-badge" th:text="${genre.name}"></span>
            </td>
            <td class="text-center pe-4">
              <div class="btn-group" role="group">
                <a th:href="@{/admin/genres/edit/{id}(id=${genre.genreId})}"
                   class="btn btn-outline-warning btn-action me-2" title="Chỉnh sửa">
                  <i class="bi bi-pencil-square"></i> Sửa
                </a>
                <a th:href="@{/admin/genres/delete/{id}(id=${genre.genreId})}"
                   class="btn btn-outline-danger btn-action"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa thể loại này? Thao tác này không thể hoàn tác.');"
                   title="Xóa">
                  <i class="bi bi-trash3"></i> Xóa
                </a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="mt-3 text-end text-muted small">
      Hiển thị <span th:text="${genres.size()}">0</span> thể loại
    </div>
  </div>
</div>

</body>
</html>
