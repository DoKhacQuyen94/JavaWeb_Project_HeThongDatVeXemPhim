<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie System</title>

    <!-- Google Fonts & Bootstrap 5 (Hiện đại hơn) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-dark: #1a1a2e;
            --accent-color: #e94560;
        }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-navbar {
            background-color: var(--primary-dark) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        }
        .admin-sidebar-nav {
            background: #fff;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }
        .admin-sidebar-nav .nav-link {
            color: #495057;
            font-weight: 500;
            padding: 10px 20px;
        }
        .admin-sidebar-nav .nav-link:hover {
            color: var(--accent-color);
            background: #fff5f6;
        }
        .admin-sidebar-nav .nav-link.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }
        .content-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            min-height: 500px;
        }
        footer {
            margin-top: auto;
            background: #fff;
            padding: 20px 0;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>

<body>

<!-- MAIN NAVBAR (Dùng chung cho tất cả) -->
<nav class="navbar navbar-expand-lg navbar-dark main-navbar px-lg-5 py-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-4" href="/home">
            <span class="text-danger">🎬</span> MOVIE<span class="text-danger">SYSTEM</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <!-- Menu nếu chưa login -->
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="btn btn-outline-light rounded-pill px-4" href="/login">Đăng nhập</a>
                </li>

                <!-- Menu nếu đã login -->
                <th:block th:if="${session.user != null}">
                    <li class="nav-item me-3">
                        <span class="text-light opacity-75 small">Xin chào, <b th:text="${session.user.email}"></b></span>
                    </li>

                    <li class="nav-item" th:if="${session.user.role == 'user'}">
                        <a class="nav-link" th:href="@{/user/history}"><i class="bi bi-ticket-perforated"></i> Lịch sử vé</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle"></i> Hồ sơ</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-danger btn-sm rounded-pill px-3" href="/logout">
                            <i class="bi bi-box-arrow-right"></i> Đăng xuất
                        </a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTAINER CHÍNH -->
<div class="container mt-4 flex-grow-1">

    <!-- ADMIN SUB-MENU (Chỉ hiện nếu là admin) -->
    <div class="admin-sidebar-nav shadow-sm mb-4" th:if="${session.user != null and session.user.role == 'admin'}">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/home}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/genres}">Thể loại</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/rooms}">Phòng chiếu</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/seats}">Ghế</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/movies}">Phim</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/showtimes}">Lịch chiếu</a>
            </li>
        </ul>
    </div>

    <!-- NƠI ĐỔ NỘI DUNG TRANG CON -->
    <div class="content-box">
        <div layout:fragment="content">
            <!-- content page từ các file khác sẽ đổ vào đây -->
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="text-center">
    <div class="container">
        <span class="text-muted">© 2026 Movie System - Phát triển bởi <b >Đỗ Khắc Quyền</b></span>
        <div class="mt-2">
            <a href="#" class="text-decoration-none text-muted mx-2 small">Điều khoản</a>
            <a href="#" class="text-decoration-none text-muted mx-2 small">Liên hệ</a>
        </div>
    </div>
</footer>

<!-- Bootstrap 5 JS Bundle (Phải có để chạy Dropdown, Toggle...) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
